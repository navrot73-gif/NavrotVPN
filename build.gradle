buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23"
    }
}

// Репозитории уже заданы в settings.gradle через dependencyResolutionManagement.
// Дублирование вызывало предупреждение "Repositories declared in allprojects
// will be ignored" и потенциальные конфликты разрешения зависимостей.

task clean(type: Delete) {
    delete rootProject.buildDir
}
