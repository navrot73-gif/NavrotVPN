name: Auto Build & Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Build Release APK
      run: gradle assembleRelease --stacktrace

    - name: Upload Debug APK to Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: NavrotVPN-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK to Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: NavrotVPN-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Status Summary
      if: always()
      run: |
        echo "## 📱 Build Status Report" >> $GITHUB_STEP_SUMMARY
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ **Сборка успешна!** APK готов в Artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Сборка не удалась.** Проверь логи выше" >> $GITHUB_STEP_SUMMARY
        fi
