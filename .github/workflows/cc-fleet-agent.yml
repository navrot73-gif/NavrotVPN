name: 🤖 DeepSeek Restructure (надёжный)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Что нужно сделать?'
        required: true
        default: 'Реструктурируй проект согласно стандартам Android'
      branch:
        description: 'Ветка для изменений'
        required: true
        default: 'main'

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Скачать код
        uses: actions/checkout@v4

      - name: 🐍 Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Установить PyGithub
        run: pip install PyGithub

      - name: 📋 Собрать список всех .kt файлов
        id: list_files
        run: |
          find . -name '*.kt' > files_list.txt
          echo "files_count=$(cat files_list.txt | wc -l)" >> $GITHUB_OUTPUT

      - name: 🤖 Запросить план у DeepSeek (JSON)
        id: deepseek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # Формируем промпт: просим выдать JSON с планом перемещения
          PROMPT="Ты — эксперт по Android-проектам. Я дам список .kt файлов. Твоя задача — предложить перемещение каждого файла в папки app/src/main/java/com/navrot/vpn/ui/, /viewmodel/, /vpn/, /config/, /crypto/, /utils/ по смыслу. Также предложи новые package-декларации. Ответь ТОЛЬКО JSON-объектом с полями: moves (массив объектов: {src, dst, new_package}). Не пиши ничего кроме JSON."
          # Отправляем запрос
          RESPONSE=$(curl -s https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -d "{
              \"model\": \"deepseek-chat\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"$PROMPT\"},
                {\"role\": \"user\", \"content\": \"Список файлов: $(cat files_list.txt)\"}
              ],
              \"temperature\": 0.2
            }")
          # Сохраняем ответ в файл
          echo "$RESPONSE" > deepseek_raw.json
          # Извлекаем содержимое из поля choices[0].message.content
          CONTENT=$(jq -r '.choices[0].message.content' deepseek_raw.json)
          echo "$CONTENT" > plan.json
          # Проверим, что это JSON
          if ! jq empty plan.json 2>/dev/null; then
            echo "Ошибка: ответ не JSON" >&2
            cat plan.json >&2
            exit 1
          fi

      - name: 📝 Python-скрипт для выполнения перемещений
        id: move_files
        run: |
          python << EOF
          import json
          import os
          import shutil
          import re

          # Читаем план
          with open('plan.json', 'r') as f:
              plan = json.load(f)

          moves = plan.get('moves', [])
          if not moves:
              print("Нет перемещений для выполнения")
              exit(0)

          # Выполняем перемещения
          for item in moves:
              src = item.get('src')
              dst = item.get('dst')
              new_pkg = item.get('new_package')
              if not src or not dst:
                  continue
              # Создаём папку назначения
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              # Перемещаем файл
              shutil.move(src, dst)
              print(f"Перемещён: {src} -> {dst}")
              # Если нужно обновить package-декларацию
              if new_pkg and os.path.exists(dst):
                  with open(dst, 'r') as f:
                      content = f.read()
                  # Заменяем package строку
                  content = re.sub(r'^package\s+[\w.]+', f'package {new_pkg}', content, flags=re.MULTILINE)
                  with open(dst, 'w') as f:
                      f.write(content)
                  print(f"Обновлён package в {dst} -> {new_pkg}")

          print("Все перемещения выполнены")
          EOF

      - name: 📦 Создать Pull Request с изменениями
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Автоматическая реструктуризация от DeepSeek"
          branch: deepseek-restructure-${{ github.run_id }}
          title: "🤖 Реструктуризация проекта (AI)"
          body: "Изменения по запросу: ${{ github.event.inputs.task }}"
          base: ${{ github.event.inputs.branch }}
