# Project-wide Gradle settings.

# JVM memory for Gradle daemon — помогает с медленной сборкой на больших проектах
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX + Jetifier для совместимости старых библиотек
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Не-nondex: ускоряет сборку на CI, но может мешать отладке
# android.enableR8.fullMode=true

# Параллельная сборка модулей
org.gradle.parallel=true

# Кэш билдов
org.gradle.caching=true